[package]
license = "Apache-2.0"
name = "orion-terminal"
version = "0.1.0"
description = "Orion Terminal — personal workstation"
authors = ["Luca Orion"]
edition = "2021"

[lib]
name = "orion_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
# Imported vector control points must survive native history JSON exactly.
serde_json = { version = "1", features = ["float_roundtrip"] }
walkdir = "2"
keyring = "3"
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
bytes = "1"
portable-pty = "0.9"
parking_lot = "0.12"
once_cell = "1"
# Used by the in-process MCP server (mode-switched via --mcp-serve) to read
# the Orion SQLite DB directly. Its libsqlite3-sys version must match sqlx;
# 0.32 allows sqlx 0.8.6 rather than pinning the vulnerable sqlx 0.8.0.
rusqlite = { version = "0.32", features = ["bundled", "backup", "hooks"] }
# Match the frontend `ulid` package — note ids etc. should be the same
# shape regardless of who creates them (frontend zustand stores vs. the
# in-process MCP server's write tools).
ulid = "1"
# Filesystem watching for Cursor-like auto-refresh of the file tree when
# anything outside the app (external editor, git, Finder, downloads) touches
# the project. `notify` is the de-facto standard (FSEvents on macOS, inotify
# on Linux, ReadDirectoryChangesW on Windows); `notify-debouncer-mini`
# batches the firehose of raw events into ~300ms windows so we refresh once
# instead of thousands of times during npm install / webpack builds.
notify = "6"
notify-debouncer-mini = "0.4"
# CPU/memory stats for the desktop monitor widget. (Temp/GPU on Apple Silicon
# need sudo/powermetrics, so the widget sticks to what sysinfo can read freely.)
sysinfo = "0.33"
photocraft-engine = { git = "https://github.com/storytold/photocraft", rev = "47f9306fd06d5dee11acb84b108606f4c867222a" }
photocraft-io = { git = "https://github.com/storytold/photocraft", rev = "47f9306fd06d5dee11acb84b108606f4c867222a" }
photocraft-format = { git = "https://github.com/storytold/photocraft", rev = "47f9306fd06d5dee11acb84b108606f4c867222a" }
photocraft-compose = { git = "https://github.com/storytold/photocraft", rev = "47f9306fd06d5dee11acb84b108606f4c867222a" }
photocraft-raster = { git = "https://github.com/storytold/photocraft", rev = "47f9306fd06d5dee11acb84b108606f4c867222a" }
photocraft-algo = { git = "https://github.com/storytold/photocraft", rev = "47f9306fd06d5dee11acb84b108606f4c867222a" }
photocraft-vector = { git = "https://github.com/storytold/photocraft", rev = "47f9306fd06d5dee11acb84b108606f4c867222a" }
photocraft-codecs = { git = "https://github.com/storytold/photocraft", rev = "47f9306fd06d5dee11acb84b108606f4c867222a", features = ["heif", "avif"] }
photocraft-psd = { git = "https://github.com/storytold/photocraft", rev = "47f9306fd06d5dee11acb84b108606f4c867222a" }
fontique = { version = "=0.11.1", default-features = false, features = ["std"] }

# `tauri dev` builds unoptimised; the photocraft image engine then renders a 512px tile in
# ~51ms instead of ~3ms, which makes photo editing unusable. Optimise dependencies only:
# they compile once, and Orion's own crate keeps fast incremental dev builds.
[profile.dev.package."*"]
opt-level = 3

# photocraft-format with batched tile flushes (vendor/photocraft/ORION_CHANGES.md). Remove once
# the pinned revision above saves new objects without two F_FULLFSYNCs each.
[patch."https://github.com/storytold/photocraft"]
photocraft-format = { path = "vendor/photocraft/crates/format" }
