name: Build & Release (macOS)

# Builds the macOS Apple Silicon .dmg and attaches it to a GitHub Release.
# - Push a tag like `v0.1.0-beta.2` -> builds and publishes to that release.
# - Or run manually (Actions tab -> Run workflow) and pass a tag name.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish to (e.g. v0.1.0-beta.2)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14 # Apple Silicon runner (aarch64)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Resolve release tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || exit 1
          printf 'value=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS deps
        run: npm ci

      - name: Verify frontend, bridges, and native code
        run: npm run verify

      - name: Block releases with high or critical production dependency advisories
        run: npm run audit:production

      - name: Install reviewed native audit tool
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Block known vulnerable or unsound dependencies in the release target
        run: npm run audit:native:target -- --target aarch64-apple-darwin

      - name: Build app (.app + .dmg)
        # Ad-hoc signing is neither notarization nor a Gatekeeper acceptance guarantee.
        run: |
          rm -rf src-tauri/target/aarch64-apple-darwin/release/bundle
          npm run tauri build -- --target aarch64-apple-darwin

      - name: Verify packaged MCP grants without a model or user profile
        run: |
          test "$(uname -m)" = arm64
          npm run test:native-policy -- --binary "$PWD/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Orion Terminal.app/Contents/MacOS/orion-terminal"

      - name: Rehearse packaged cold recovery without a live profile
        run: |
          python3 scripts/rehearse-profile-recovery.py --binary "$PWD/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Orion Terminal.app/Contents/MacOS/orion-terminal" --report "$RUNNER_TEMP/profile-recovery.json"

      - name: Stage release asset (stable name)
        id: asset
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=(src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)
          if [ "${#images[@]}" -ne 1 ]; then echo "Expected exactly one fresh target .dmg"; exit 1; fi
          src="${images[0]}"
          stable="Orion-Terminal_aarch64.dmg"
          cp "$src" "$stable"
          echo "Built: $src -> $stable"
          echo "stable=$stable" >> "$GITHUB_OUTPUT"
          echo "versioned=$src" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: ${{ steps.tag.outputs.value }}
          # Must be false so /releases/latest/download/... resolves.
          # GitHub's "latest" endpoint ignores prereleases. The -beta tag
          # name + the site copy still communicate that this is a beta.
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            ${{ steps.asset.outputs.stable }}
            ${{ steps.asset.outputs.versioned }}
