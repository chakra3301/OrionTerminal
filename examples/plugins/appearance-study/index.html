<!doctype html>
<html data-theme="liquid" data-color-mode="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orion imported-app appearance study</title>
<style>body{margin:0;background:var(--bg-0-solid,var(--bg-0));color:var(--t-primary);font:13px system-ui,sans-serif}main{max-width:1040px;margin:36px auto;padding:0 24px}header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}h1{font-size:18px;font-weight:500;flex:1;margin:0}select,button{background:var(--bg-2-solid,var(--bg-2));color:var(--t-primary);border:1px solid var(--glass-border);border-radius:8px;padding:8px 12px}p{color:var(--t-secondary);line-height:1.6}iframe{display:block;width:100%;height:640px;border:1px solid var(--glass-border);border-radius:17px}output{display:block;margin-top:14px;color:var(--t-secondary);font-size:11px}button[aria-pressed=true]{outline:1px solid var(--t-primary)}</style></head><body><main>
<header><h1>Imported app appearance</h1><select id="theme" aria-label="Theme"><option value="liquid">Liquid</option><option value="minimal">Minimal</option><option value="bmw-m">BMW M</option><option value="ivory-keep">Ivory Keep</option></select><button id="original" type="button" aria-pressed="false">Original styling</button></header>
<p>Static appearance study. Illustrative board only—no game engine, repository execution, native broker or saved gameplay.</p>
<iframe id="preview" title="2048 appearance study" sandbox="allow-scripts"></iframe><output id="status">Preparing local appearance…</output>
</main><script type="module">
import "/src/styles/tokens.css";
import "/src/styles/themes.css";
import "/src/styles/lightThemes.css";
import { capturePluginAppearance } from "/src/plugins/pluginAppearance.ts";
import { appearanceClientScript } from "/src/plugins/pluginAppearanceClient.ts";
import { preparePluginDocuments } from "/src/plugins/pluginDocument.ts";
const frame=document.querySelector("#preview"), sessionId="appearance-study", channel="orion-plugin-rpc",version=1;
let mode="orion",ready=false;
const rows=Array.from({length:4},()=>'<div class="grid-row">'+Array.from({length:4},()=>'<div class="grid-cell"></div>').join('')+'</div>').join('');
const tiles=[[2,1,1],[4,2,1],[8,3,1],[16,4,1],[128,1,2],[512,2,2],[1024,3,2],[2048,4,2]].map(([v,x,y])=>`<div class="tile tile-${v} tile-position-${x}-${y}"><div class="tile-inner">${v}</div></div>`).join('');
const positions=Array.from({length:4},(_,x)=>Array.from({length:4},(_,y)=>`.tile-position-${x+1}-${y+1}{transform:translate(calc(${x} * (100% + 12px)),calc(${y} * (100% + 12px)))}`).join('')).join('');
const content=`<!doctype html><html><head><style>${positions}
body{margin:0;padding:24px;background:#faf8ef;color:#776e65;font:16px system-ui,sans-serif}.container{max-width:480px;margin:auto}.heading{display:flex;justify-content:space-between}.title{font-size:64px;margin:0}.scores-container{display:flex;gap:8px}.score-container,.best-container{position:relative;background:#bbada0;color:#fff;padding:22px 14px 8px;border-radius:4px}.score-container::after,.best-container::after{position:absolute;top:7px;left:0;right:0;text-align:center;font-size:10px}.score-container::after{content:"Score"}.best-container::after{content:"Best"}.above-game{display:flex;align-items:center;gap:16px}.game-intro{flex:1}.restart-button{background:#8f7a66;color:white;border:0;border-radius:4px;padding:12px}.game-container{position:relative;padding:14px;box-sizing:border-box;width:100%;aspect-ratio:1;background:#bbada0;border-radius:6px;margin-top:16px}.grid-container{position:absolute;z-index:1;width:calc(100% - 28px);display:flex;flex-direction:column;gap:12px;height:calc(100% - 28px)}.grid-row::after,.heading::after,.above-game::after{content:"";display:block;clear:both}.grid-row{display:flex;gap:12px;flex:1}.grid-cell{flex:1;background:#cdc1b4;border-radius:4px}.tile-container{position:absolute;z-index:2;inset:14px}.tile{position:absolute;width:calc((100% - 36px)/4);height:calc((100% - 36px)/4)}.tile-inner{height:100%;display:grid;place-items:center;background:#eee4da;border-radius:4px;font-size:32px;font-weight:600}.game-explanation{font-size:12px;margin-top:18px;line-height:1.6}
</style></head><body data-orion-appearance="v1" data-orion-skin="2048"><section class="adapter-status"><p id="save-status">Appearance only · no saves</p><button id="save-retry" disabled hidden>Retry storage</button><p id="save-warning" hidden>Illustrative warning—no storage operations were attempted.</p></section><div class="container"><div class="heading"><h1 class="title">2048</h1><div class="scores-container"><div class="score-container">—</div><div class="best-container">—</div></div></div><div class="above-game"><p class="game-intro">The same app. At home in Orion.</p><button class="restart-button" disabled>New game</button></div><div class="game-container" tabindex="0"><div class="grid-container">${rows}</div><div class="tile-container">${tiles}</div></div><p class="game-explanation">Illustrative layout, not earned scores or a playable import. Original game logic is intentionally absent.</p></div></body></html>`;
const bridge=`const channel=${JSON.stringify(channel)},version=1,sessionId=${JSON.stringify(sessionId)};${appearanceClientScript(capturePluginAppearance())}
const instance=Math.random().toString(16).slice(2);const report=()=>requestAnimationFrame(()=>{const rect=n=>{const r=n.getBoundingClientRect();return {x:r.x,y:r.y,w:r.width,h:r.height}};parent.postMessage({channel,version,sessionId,type:"ready",layout:{instance,warningVisible:!document.querySelector("#save-warning").hidden,mode:document.documentElement.dataset.orionStyle,scheme:document.documentElement.style.colorScheme,revision:appearance.get()?.revision,board:rect(document.querySelector(".game-container")),cell:rect(document.querySelector(".grid-cell")),tile:rect(document.querySelector(".tile-inner")),tiles:[...document.querySelectorAll(".tile")].map(rect),font:getComputedStyle(document.querySelector(".title")).fontFamily,fontReady:document.fonts.check('500 40px "Orion Space Grotesk"'),material:document.documentElement.dataset.orionMaterial,reducedMotion:document.documentElement.dataset.orionMotion,reducedTransparency:document.documentElement.dataset.orionTransparency,background:getComputedStyle(document.body).backgroundColor}},"*")});appearance.subscribe(report);parent.postMessage({channel,version,sessionId,type:"ready"},"*");report();document.fonts.ready.then(report);addEventListener("message",e=>{const m=e.data;if(e.source===parent&&m?.channel===channel&&m.version===version&&m.sessionId===sessionId&&m.type==="response"&&m.id==="study-warning"&&typeof m.result?.visible==="boolean"){document.querySelector("#save-warning").hidden=!m.result.visible;report()}});`;
frame.srcdoc=preparePluginDocuments(content,"ui",bridge,sessionId).guard;
function publish(){if(ready)frame.contentWindow.postMessage({channel,version,sessionId,type:"appearance",appearance:capturePluginAppearance(mode)},"*")}
window.addEventListener("message",e=>{if(e.source!==frame.contentWindow)return;const m=e.data;if(m?.channel===channel&&m.sessionId===sessionId&&m.type==="ready"&&!m.layout){ready=true;publish()}});
// Diagnostics follow the same guard's bound child forwarding; the study exposes no broker.
window.addEventListener("message",e=>{const m=e.data;if(e.source===frame.contentWindow&&m?.channel===channel&&m.version===version&&m.sessionId===sessionId&&m.layout){window.studyLayout=m.layout;document.querySelector("#status").textContent=`${m.layout.mode} · ${m.layout.scheme} · native font ${m.layout.font} · board ${Math.round(m.layout.board.w)}px`}});
document.querySelector("#theme").addEventListener("change",e=>{const value=e.target.value;document.documentElement.dataset.theme=value;document.documentElement.dataset.colorMode=value==="ivory-keep"?"light":"dark";publish()});
document.querySelector("#original").addEventListener("click",e=>{mode=mode==="orion"?"original":"orion";e.target.setAttribute("aria-pressed",String(mode==="original"));publish()});
window.study={publish,frame,warning:(visible)=>frame.contentWindow.postMessage({channel,version,sessionId,type:"response",id:"study-warning",result:{visible}},"*")};
</script></body></html>
